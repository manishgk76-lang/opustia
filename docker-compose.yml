services:
  postgres:
    image: postgres:16-alpine
    container_name: opustia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opustia
      POSTGRES_PASSWORD: opustia_dev_password
      POSTGRES_DB: opustia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opustia -d opustia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
